<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auth Analyzer results</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#5d6672;--line:#e1e5ea;--accent:#2457d6;--l1:#2e8b57;--l2:#6a9f2f;--l3:#c98a00;--l4:#d9622b;--l5:#c4262e}
@media (prefers-color-scheme:dark){:root{--bg:#12151a;--card:#1b2027;--ink:#e7eaee;--mute:#9aa4b0;--line:#2a313a;--accent:#6b93ff;--l1:#4cc38a;--l2:#9ac95a;--l3:#e6b43c;--l4:#f08a55;--l5:#ff6b72}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px}
h1{margin:0 0 4px}.mute{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.score{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.badge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.act-Keep{background:var(--l1)}.act-Review{background:var(--l3)}.act-Revoke{background:var(--l5)}.act-Unknown{background:var(--mute)}
.lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}.lv4{background:var(--l4)}.lv5{background:var(--l5)}
select{padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;max-width:100%}
ul{margin:8px 0;padding-left:18px}.flag{color:var(--l5);font-weight:600}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:8px}
pre{white-space:pre-wrap;font-size:12px;background:var(--bg);padding:8px;border-radius:8px;max-height:240px;overflow:auto}
a.btn{display:inline-block;margin-top:8px;padding:7px 12px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:13px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.lvu{background:var(--mute)}
.pill{display:inline-block;min-width:60px;text-align:center;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}
.tags{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:4px 0}
.tags span{border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.lim{font-size:12px}
button{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
dl.sum{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:10px 0}dl.sum dt{font-weight:600;color:var(--mute);font-size:13px}dl.sum dd{margin:0}dl.sum ul{margin:0;padding-left:16px}
.banner{background:var(--card);border:1px solid var(--l3);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px}
</style></head><body><main>
<h1>Auth Analyzer</h1>
<div class="mute"><span id="meta"></span> <span id="rules"></span> <select id="acct" aria-label="Filter by account" hidden></select> <button id="export">Export report</button> <button id="exportR">Export (names hidden)</button> <button id="clear">Delete saved scan</button></div>
<div id="banner"></div>
<div id="errors"></div>
<div id="out"></div>
<div id="dbg"></div>
</main>
<script type="module" src="results.js"></script>
</body></html>
